[project]
name = "eq-hd-textures"
version = "0.1.0"
description = "Upscale EverQuest .s3d textures with a local super-resolution model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "spandrel>=0.4.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
eq-hd = "eq_hd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eq_hd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
