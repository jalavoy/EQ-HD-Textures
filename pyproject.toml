[project]
name = "eq-hd-textures"
version = "0.1.0"
description = "Upscale EverQuest .s3d textures with a local super-resolution model"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# Light dependencies only: the GUI runs without the engine's heavy ones.
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "rich>=15.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
eq-hd = "eq_hd.cli:main"

[project.gui-scripts]
eq-hd-gui = "eq_hd.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# The upscaling engine (PyTorch with CUDA 12.8). Installed by default, so
# `uv run eq-hd` works as before; the GUI's own environment leaves it out.
engine = [
    "spandrel>=0.4.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
gui = [
    "packaging>=24",
    "pyside6-essentials>=6.8",
]
dev = [
    "pytest>=9.2.0",
    "packaging>=24",
    "pyside6-essentials>=6.8",
    "ziglang==0.17.1",
]

[tool.uv]
default-groups = ["engine", "dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/eq_hd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
